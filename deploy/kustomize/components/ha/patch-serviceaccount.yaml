# Native hub HA (#71): the hub talks to the API server (Lease election), so
# its ServiceAccount token MUST be mounted. The base SA sets this false (the
# non-HA exporter never calls the API). Mirrors the ha.enabled value in
# deploy/helm/topology-exporter/templates/serviceaccount.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: topology-exporter
automountServiceAccountToken: true
