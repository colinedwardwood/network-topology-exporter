apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: topology-exporter
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: topology-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: topology-exporter
          # Image (repository:tag) is set by kustomization.yaml `images:`.
          image: ghcr.io/colinedwardwood/network-topology-exporter:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --config.file=/etc/topology-exporter/config.yaml
            - --web.listen-address=:9100
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          # /healthz returns 503 once the discovery loop has gone stale (no
          # completed cycle within discovery.interval ×
          # discovery.liveness_max_stale_cycles, default 3 cycles), so a wedged
          # loop is restarted. Inert for federation.role: hub (no local loop).
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          # CPU limit intentionally omitted: discovery is bursty and a cpu limit
          # would invite CFS throttling that stretches cycle latency. Memory keeps
          # a hard limit to bound blast radius. Mirrors deploy/helm values.yaml. (#122)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/topology-exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: topology-exporter
