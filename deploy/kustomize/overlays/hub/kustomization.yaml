apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hub overlay: pure aggregator that receives spoke pushes on a separate mTLS
# listener (default :9101). Maps to config.federation.role: hub.
resources:
  - ../../base

labels:
  # includeTemplates propagates the instance label onto the pod template
  # (spec.template.metadata.labels) without touching the immutable
  # spec.selector.matchLabels. The HA component's headless metrics Service
  # (components/ha/service-metrics.yaml) selects on app.kubernetes.io/instance
  # to avoid matching spoke pods in a shared namespace, so hub pods must carry
  # it. Mirrors the Helm chart, where selectorLabels include the instance.
  - includeTemplates: true
    pairs:
      app.kubernetes.io/instance: hub

# Replace the base config (federation.role: hub + listener/TLS settings).
patches:
  - path: configmap.yaml
    target:
      kind: ConfigMap
      name: topology-exporter
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: topology-exporter
  - path: patch-service.yaml
    target:
      kind: Service
      name: topology-exporter
  - path: patch-networkpolicy.yaml
    target:
      kind: NetworkPolicy
      name: topology-exporter
