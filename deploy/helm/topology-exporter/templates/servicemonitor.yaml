{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "topology-exporter.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "topology-exporter.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "topology-exporter.selectorLabels" . | nindent 6 }}
      {{- if .Values.federation.hub.ha.enabled }}
      {{- /* HA exposes two Services sharing selectorLabels; target only the
             headless metrics Service so every replica is scraped (the push
             Service is readiness-gated to the leader). */}}
      topology-exporter.grafana.com/service: metrics
      {{- end }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      path: /metrics
{{- end }}
