{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "topology-exporter.serviceAccountName" . }}
  labels:
    {{- include "topology-exporter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* HA's leader elector needs the SA token to reach the API server; off path keeps token disabled. */}}
automountServiceAccountToken: {{ .Values.federation.hub.ha.enabled }}
{{- end }}
