{{- if .Values.federation.hub.ha.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "topology-exporter.fullname" . }}
  labels:
    {{- include "topology-exporter.labels" . | nindent 4 }}
rules:
  # Native hub HA (#71) elects a leader via a coordination.k8s.io Lease.
  # get/create/update is the minimal verb set client-go leaderelection needs.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
{{- end }}
