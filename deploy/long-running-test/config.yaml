discovery:
  interval: 30s
  timeout_per_device: 10s
  parallelism: 20
  scope:
    # 172.30.0.0/24 bounds IP-based scope to the lab subnet.
    # 0.0.0.0/0 is required for LLDP because nte-testnode advertises a MAC
    # chassis ID; the LD-11 scope filter at internal/discovery/lldp/lldp.go:316
    # otherwise drops every neighbour with a non-IP chassis when the allow-list
    # is non-catch-all. See CHANGELOG entry D54 for the rationale.
    cidr_allow_list:
      - "172.30.0.0/24"
      - "0.0.0.0/0"

modules:
  snmp:
    enabled: true
    version: v2c
  lldp:
    enabled: true

credentials:
  profiles:
    - name: lab-v2c
      type: snmp_v2c
      community_env: SNMP_COMMUNITY
  fallback_order: [lab-v2c]

snapshot:
  path: /var/lib/network-topology-exporter/snapshot.json

targets:
  - host: 172.30.0.11 # spine1
    labels: { site: long-running-lab }
  - host: 172.30.0.12 # spine2
    labels: { site: long-running-lab }
  - host: 172.30.0.21 # leaf1
    labels: { site: long-running-lab }
  - host: 172.30.0.22 # leaf2
    labels: { site: long-running-lab }
  - host: 172.30.0.23 # leaf3
    labels: { site: long-running-lab }
  - host: 172.30.0.24 # leaf4
    labels: { site: long-running-lab }
