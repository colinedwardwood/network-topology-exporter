name: nte-dynamic-1
topology:
  nodes:
    spine1: { kind: linux, image: nte-testnode:latest }
    leaf1:  { kind: linux, image: nte-testnode:latest }
    leaf2:  { kind: linux, image: nte-testnode:latest }
    leaf3:  { kind: linux, image: nte-testnode:latest }
    leaf4:  { kind: linux, image: nte-testnode:latest }
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["leaf1:eth2", "leaf2:eth1"]
    - endpoints: ["leaf2:eth2", "leaf3:eth1"]
    - endpoints: ["leaf3:eth2", "leaf4:eth1"]
    - endpoints: ["leaf4:eth2", "spine1:eth2"] # Ring topology
