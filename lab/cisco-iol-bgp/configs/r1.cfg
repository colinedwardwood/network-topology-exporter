!
! Cisco IOL L2-17.12.1 — node r1
! iBGP partner of r2 in AS 65001.
!
! L2 IOL is a switch image. We attempt to force Ethernet0/1 into routed
! mode via `no switchport`. If this is rejected by the image (i.e. the
! L2 build truly lacks L3 routing), the deploy will surface the error
! in the node logs — see README.md troubleshooting section.
!
hostname r1
!
ip routing
!
interface Ethernet0/0
 description containerlab management
 no switchport
 ip address 172.20.20.3 255.255.255.0
 no shutdown
!
interface Loopback0
 description bgp router-id
 ip address 1.1.1.1 255.255.255.255
 no shutdown
!
interface Ethernet0/1
 description to r2
 no switchport
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
router bgp 65001
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 network 1.1.1.1 mask 255.255.255.255
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 update-source Ethernet0/1
 neighbor 10.0.0.2 description ibgp-r2
!
! SNMP v2c read-only access for the capture script.
! Community "public" matches the default in capture.sh; override via
! SNMP_COMMUNITY env var if you change it here.
!
snmp-server community public RO
snmp-server location lab-cisco-iol-bgp
snmp-server contact issue#1-fixture-capture
snmp-server enable traps bgp
!
line vty 0 4
 transport input ssh
!
end
