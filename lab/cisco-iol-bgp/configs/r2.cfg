!
! Cisco IOL L2-17.12.1 — node r2
! iBGP partner of r1 in AS 65001.
!
hostname r2
!
ip routing
!
interface Loopback0
 description bgp router-id
 ip address 2.2.2.2 255.255.255.255
 no shutdown
!
interface Ethernet0/0
 description to r1
 no switchport
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
router bgp 65001
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 network 2.2.2.2 mask 255.255.255.255
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 update-source Ethernet0/0
 neighbor 10.0.0.1 description ibgp-r1
!
snmp-server community public RO
snmp-server location lab-cisco-iol-bgp
snmp-server contact issue#1-fixture-capture
snmp-server enable traps bgp
!
line vty 0 4
 transport input ssh
!
end
