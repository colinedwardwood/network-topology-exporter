!
! Arista cEOS 4.36.0F — node r1
! iBGP partner of r2 in AS 65001.
!
hostname r1
!
ip routing
!
interface Management0
   ip address 172.20.20.13/24
   no shutdown
!
interface Loopback0
   description bgp router-id
   ip address 1.1.1.1/32
!
interface Ethernet1
   description to r2
   no switchport
   ip address 10.0.0.1/30
   no shutdown
!
router bgp 65001
   router-id 1.1.1.1
   no bgp default ipv4-unicast
   neighbor 10.0.0.2 remote-as 65001
   neighbor 10.0.0.2 description ibgp-r2
   neighbor 10.0.0.2 update-source Ethernet1
   !
   address-family ipv4
      neighbor 10.0.0.2 activate
      network 1.1.1.1/32
!
snmp-server community public ro
snmp-server location lab-arista-ceos-bgp
snmp-server contact issue#1-fixture-capture
!
management api http-commands
   no shutdown
!
end
