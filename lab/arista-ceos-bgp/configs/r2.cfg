!
! Arista cEOS 4.36.0F — node r2
! iBGP partner of r1 in AS 65001.
!
hostname r2
!
ip routing
!
interface Management0
   ip address 172.20.20.12/24
   no shutdown
!
interface Loopback0
   description bgp router-id
   ip address 2.2.2.2/32
!
interface Ethernet1
   description to r1
   no switchport
   ip address 10.0.0.2/30
   no shutdown
!
router bgp 65001
   router-id 2.2.2.2
   no bgp default ipv4-unicast
   neighbor 10.0.0.1 remote-as 65001
   neighbor 10.0.0.1 description ibgp-r1
   neighbor 10.0.0.1 update-source Ethernet1
   !
   address-family ipv4
      neighbor 10.0.0.1 activate
      network 2.2.2.2/32
!
snmp-server community public ro
snmp-server location lab-arista-ceos-bgp
snmp-server contact issue#1-fixture-capture
!
management api http-commands
   no shutdown
!
end
