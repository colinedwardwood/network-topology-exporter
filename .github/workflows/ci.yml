name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  build-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: unit tests
        run: go test ./... -race -count=1 -timeout 120s -coverprofile=coverage.out

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration-test:
    name: integration tests
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: integration tests
        run: go test ./tests/integration/... -tags integration -race -count=1 -timeout 60s

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: helm lint
        run: helm lint deploy/helm/topology-exporter/

      - name: helm template (default values)
        run: helm template test deploy/helm/topology-exporter/ > /dev/null

      - name: helm template (all features enabled)
        run: |
          helm template test deploy/helm/topology-exporter/ \
            --set persistence.enabled=true \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set service.hubEnabled=true \
            > /dev/null

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [build-test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: network-topology-exporter:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-test:
    name: e2e tests (containerlab)
    runs-on: ubuntu-latest
    # Run on main-branch pushes only — LLDP convergence wait (45 s) makes this
    # too slow for every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: build test node image
        run: docker build -t nte-testnode:latest tests/e2e/testnode/

      - name: e2e tests
        run: CLAB_SUDO=1 go test ./tests/e2e/... -tags e2e -v -count=1 -timeout 15m

  e2e-test-srl:
    name: e2e tests (SR Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: pull SR Linux image
        run: docker pull ghcr.io/nokia/srlinux:24.7.2

      - name: e2e tests (SR Linux)
        run: CLAB_SUDO=1 go test ./tests/e2e/srl/... -tags e2e_srl -v -count=1 -timeout 20m

  release:
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, integration-test, lint, helm-lint, docker]
    permissions:
      contents: write  # create GitHub release
      packages: write  # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: go build release binaries
        run: |
          mkdir -p bin
          LDFLAGS="-s -w \
            -X github.com/colinedwardwood/network-topology-exporter/internal/version.Version=${{ github.ref_name }} \
            -X github.com/colinedwardwood/network-topology-exporter/internal/version.Commit=${{ github.sha }} \
            -X github.com/colinedwardwood/network-topology-exporter/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o bin/topology-exporter-linux-amd64 ./cmd/topology-exporter
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" \
            -o bin/topology-exporter-linux-arm64 ./cmd/topology-exporter

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/topology-exporter-linux-amd64
            bin/topology-exporter-linux-arm64
          generate_release_notes: true
