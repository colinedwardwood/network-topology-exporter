name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  build-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: unit tests
        run: go test ./... -race -count=1 -timeout 120s -coverprofile=coverage.out

      # Gate: total statement coverage must not regress below the floor. Set
      # below the current level (~85%) with headroom for normal fluctuation;
      # raise the floor as coverage improves. Prevents silent erosion.
      - name: enforce coverage floor
        run: |
          min=83.0
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${pct}% (floor: ${min}%)"
          awk -v p="$pct" -v m="$min" 'BEGIN { exit (p+0 >= m+0) ? 0 : 1 }' || {
            echo "::error::total coverage ${pct}% is below the required floor of ${min}%"
            exit 1
          }

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration-test:
    name: integration tests
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: integration tests
        run: go test ./tests/integration/... -tags integration -race -count=1 -timeout 60s

  fuzz-short:
    name: fuzz (short, every PR)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      # Short fuzz pass per target — ~30s each — runs on every push / PR.
      # Catches regressions introduced alongside other changes. The nightly
      # workflow (fuzz-nightly) runs each target for ~10 min to exercise the
      # coverage-guided engine more thoroughly.
      - name: fuzz parsers
        run: |
          set -e
          for pkg in bgp fdb ospf mpls lldp snmp; do
            cd "$GITHUB_WORKSPACE"
            FUZZ_TARGETS=$(go test -list 'Fuzz.*' "./internal/discovery/$pkg" | grep '^Fuzz')
            for t in $FUZZ_TARGETS; do
              echo "▼ $pkg.$t"
              go test -run=NONE -fuzz="^$t\$" -fuzztime=30s "./internal/discovery/$pkg"
            done
          done

      - name: upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-failure
          path: internal/discovery/*/testdata/fuzz/**

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12

  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  license-check:
    name: license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: install go-licenses
        run: go install github.com/google/go-licenses@latest

      # Fails the build if any dependency carries a forbidden or unidentifiable
      # license. The project is AGPL-3.0, so copyleft (GPL/LGPL/MPL) deps are
      # compatible and intentionally NOT disallowed; "forbidden" catches truly
      # incompatible/proprietary licenses and "unknown" forces a human to
      # classify anything go-licenses can't detect before it ships.
      - name: check dependency licenses
        run: |
          go-licenses check ./... \
            --disallowed_types=forbidden,unknown \
            --ignore github.com/colinedwardwood/network-topology-exporter

  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.17.0

      - name: helm lint
        run: helm lint deploy/helm/topology-exporter/

      - name: helm template (default values)
        run: helm template test deploy/helm/topology-exporter/ > /dev/null

      - name: helm template (all features enabled)
        run: |
          helm template test deploy/helm/topology-exporter/ \
            --set persistence.enabled=true \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set service.hubEnabled=true \
            > /dev/null

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [build-test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: docker build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: network-topology-exporter:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-test:
    name: e2e tests (containerlab)
    runs-on: ubuntu-latest
    # Run on main-branch pushes only — LLDP convergence wait (45 s) makes this
    # too slow for every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: build test node image
        run: docker build -t nte-testnode:latest tests/e2e/testnode/

      - name: e2e tests
        run: CLAB_SUDO=1 go test ./tests/e2e/... -tags e2e -v -count=1 -timeout 15m

  e2e-test-srl:
    name: e2e tests (SR Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"

      - name: pull SR Linux image
        run: docker pull ghcr.io/nokia/srlinux:24.7.2

      - name: e2e tests (SR Linux)
        run: CLAB_SUDO=1 go test ./tests/e2e/srl/... -tags e2e_srl -v -count=1 -timeout 20m

  scripts:
    name: scripts lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: install bats
        run: |
          sudo apt-get install -y bats
      - name: install python + ruff + pytest
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install python deps
        run: pip install ruff==0.7.4 pytest==8.3.4
      - name: shellcheck
        if: hashFiles('scripts/colleague-capture-lib/*.sh', 'scripts/colleague-capture.sh', 'lab/*/colleague-capture.sh') != ''
        run: |
          set -e
          files=""
          [ -f scripts/colleague-capture.sh ] && files="$files scripts/colleague-capture.sh"
          for f in scripts/colleague-capture-lib/*.sh lab/*/colleague-capture.sh; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -n "$files" ]; then shellcheck $files; fi
      - name: ruff
        if: hashFiles('scripts/redact-snmp-capture.py') != ''
        run: ruff check scripts/redact-snmp-capture.py
      - name: bats
        if: hashFiles('tests/scripts/test_lib_*.bats') != ''
        run: bats tests/scripts/test_lib_*.bats
      - name: pytest
        if: hashFiles('tests/scripts/test_redact_snmp_capture.py') != ''
        run: pytest tests/scripts/test_redact_snmp_capture.py -v

  release:
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, integration-test, lint, helm-lint, docker]
    env:
      # Secrets cannot be referenced directly in `if:` expressions, so derive a
      # plain env flag from the Docker Hub token. When the DOCKERHUB_TOKEN secret
      # is absent this is 'false' and the release stays GHCR-only; once the secret
      # is provisioned it flips to 'true' and the image is mirrored to Docker Hub.
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: write       # create GitHub release
      packages: write       # push to ghcr.io
      id-token: write       # OIDC for cosign keyless + SLSA attestations
      attestations: write   # write build-provenance attestations to GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gated on DOCKERHUB_ENABLED: skipped (not failed) when the secret is absent.
      - name: log in to Docker Hub
        if: ${{ env.DOCKERHUB_ENABLED == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # Build the metadata-action images list: GHCR always, Docker Hub appended
      # only when the mirror is enabled. Emitting a multiline value via a heredoc
      # to $GITHUB_OUTPUT lets metadata-action push every tag to both registries
      # from a single build-push, so the cosign loop and binary steps stay shared.
      - name: compute image registries
        id: imgs
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${{ github.repository }}"
            if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
              echo "docker.io/${{ github.repository }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.imgs.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: build and push
        id: build_push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: sign container image (cosign keyless)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: attest container image build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true

      # Same digest, mirrored to Docker Hub; only runs when the mirror is enabled.
      - name: attest container image build provenance (Docker Hub)
        if: ${{ env.DOCKERHUB_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ github.repository }}
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true

      - name: go build release binaries
        run: |
          mkdir -p bin
          LDFLAGS="-s -w \
            -X github.com/colinedwardwood/network-topology-exporter/internal/version.Version=${{ github.ref_name }} \
            -X github.com/colinedwardwood/network-topology-exporter/internal/version.Commit=${{ github.sha }} \
            -X github.com/colinedwardwood/network-topology-exporter/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o bin/topology-exporter-linux-amd64 ./cmd/topology-exporter
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" \
            -o bin/topology-exporter-linux-arm64 ./cmd/topology-exporter

      - name: sign release binaries (cosign keyless)
        run: |
          for f in bin/topology-exporter-linux-amd64 bin/topology-exporter-linux-arm64; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              "${f}"
          done

      - name: attest binary build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            bin/topology-exporter-linux-amd64
            bin/topology-exporter-linux-arm64

      # SBOM (SPDX) for the published image — the third leg of the supply-chain
      # story alongside cosign signatures and SLSA provenance. Generated with
      # syft (via anchore/sbom-action), attested to the registry as an in-toto
      # SPDX predicate, signed as a blob, and attached to the release + the
      # offline tarball.
      - name: generate image SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build_push.outputs.digest }}
          format: spdx-json
          output-file: network-topology-exporter-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest image SBOM
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          SBOM: network-topology-exporter-${{ github.ref_name }}.spdx.json
        run: |
          cosign attest --yes --type spdxjson --predicate "${SBOM}" \
            "ghcr.io/${{ github.repository }}@${DIGEST}"
          if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
            cosign attest --yes --type spdxjson --predicate "${SBOM}" \
              "docker.io/${{ github.repository }}@${DIGEST}"
          fi

      - name: sign SBOM (cosign keyless)
        env:
          SBOM: network-topology-exporter-${{ github.ref_name }}.spdx.json
        run: |
          cosign sign-blob --yes \
            --output-signature "${SBOM}.sig" \
            --output-certificate "${SBOM}.cert" \
            "${SBOM}"

      # Offline install bundle for air-gapped / proxy-restricted shops that can
      # reach neither ghcr.io nor docker.io. Contains the static binaries plus
      # their cosign sigs/certs, the example config, the Helm chart, and the
      # Helm-free Kustomize overlay tree.
      - name: assemble offline tarball
        env:
          TARBALL: network-topology-exporter-${{ github.ref_name }}-offline.tar.gz
        run: |
          staging="offline/network-topology-exporter-${{ github.ref_name }}"
          mkdir -p "${staging}/bin" "${staging}/config" "${staging}/deploy"
          cp bin/topology-exporter-linux-amd64 \
             bin/topology-exporter-linux-amd64.sig \
             bin/topology-exporter-linux-amd64.cert \
             bin/topology-exporter-linux-arm64 \
             bin/topology-exporter-linux-arm64.sig \
             bin/topology-exporter-linux-arm64.cert \
             "${staging}/bin/"
          cp config/example.yaml "${staging}/config/"
          cp network-topology-exporter-${{ github.ref_name }}.spdx.json "${staging}/"
          cp -R deploy/helm/topology-exporter "${staging}/deploy/helm-chart"
          cp -R deploy/kustomize "${staging}/deploy/kustomize"
          tar -czf "${TARBALL}" -C offline "network-topology-exporter-${{ github.ref_name }}"

      - name: sign offline tarball (cosign keyless)
        env:
          TARBALL: network-topology-exporter-${{ github.ref_name }}-offline.tar.gz
        run: |
          cosign sign-blob --yes \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.cert" \
            "${TARBALL}"

      - name: create github release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            bin/topology-exporter-linux-amd64
            bin/topology-exporter-linux-amd64.sig
            bin/topology-exporter-linux-amd64.cert
            bin/topology-exporter-linux-arm64
            bin/topology-exporter-linux-arm64.sig
            bin/topology-exporter-linux-arm64.cert
            network-topology-exporter-${{ github.ref_name }}-offline.tar.gz
            network-topology-exporter-${{ github.ref_name }}-offline.tar.gz.sig
            network-topology-exporter-${{ github.ref_name }}-offline.tar.gz.cert
            network-topology-exporter-${{ github.ref_name }}.spdx.json
            network-topology-exporter-${{ github.ref_name }}.spdx.json.sig
            network-topology-exporter-${{ github.ref_name }}.spdx.json.cert
          generate_release_notes: true
