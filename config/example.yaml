# network-topology-exporter — example configuration.
#
# Output: Prometheus metrics on /metrics, structured JSON log lines to stderr.
# Change events are log lines; ship them to Loki/Elasticsearch with the
# collector agent already in your stack (Promtail, Alloy, Fluentd, etc.).
# See README.md for the full metric reference and docs/operator/ for runbooks.
#
# This file is the authoritative schema document for the config (ROADMAP v1.5.0).
# Every accepted YAML key path is listed here (active or commented-out).
# Keys intentionally absent from the active section use sensible defaults:
#   listen.addr                         ":9100"
#   listen.web_config_file              "" (plain HTTP, no auth)
#   discovery.timeout_per_module        0 (no per-module cap)
#   discovery.max_graph_devices         0 (unlimited)
#   discovery.max_graph_edges           0 (unlimited)
#   modules.isis.enabled                false
#   modules.mpls_te.enabled             false
#   credentials.profiles[].retries      1
#   credentials.profiles[].context_name "" (no SNMPv3 context)
#   federation.role                     "standalone"
#   federation.spoke_timeout            3 × discovery.interval
#   federation.hub.listen_addr          ":9101"
#   federation.hub.min_push_interval    0 (rate limit disabled)
#   output.otlp.enabled                 false

# ─── HTTP listen address and optional auth ───────────────────────────────────
# listen:
#   addr: :9100                   # default ":9100"; host:port or :port
#   # web_config_file points at a Prometheus exporter-toolkit web-config YAML
#   # (same schema as snmp_exporter, node_exporter, blackbox_exporter).
#   # Supports basic_auth, server TLS, and full mTLS.  Omit for plain HTTP.
#   # web_config_file: /etc/topology-exporter/web-config.yml
#   # debug_listen_addr enables net/http/pprof at /debug/pprof/* on a SEPARATE
#   # listener for grabbing CPU/heap/goroutine/mutex profiles during incidents.
#   # Empty (default) = OFF (no listener, no profiling overhead). It has NO auth
#   # and NO TLS, so it MUST NOT be exposed to the internet — bind to localhost
#   # or a management interface only. See docs/operator/troubleshooting.md.
#   # debug_listen_addr: 127.0.0.1:6060

# ─── Discovery cycle controls ───────────────────────────────────────────────
discovery:
  interval: 60s              # default 60s; how often the full discovery cycle runs
  timeout_per_device: 10s   # default 10s; SNMP deadline per device per cycle
  parallelism: 20            # default 32; max concurrent device polls

  # Cycle budget: cancel device walks still running after this fraction of
  # the interval (default 0.8 = 80%). Cancelled targets increment
  # network_topology_cycle_budget_skips_total.
  cycle_budget_fraction: 0.8

  # Liveness staleness gate (default 3). /healthz is the Kubernetes liveness
  # target. When the most recent discovery cycle is older than
  # interval × liveness_max_stale_cycles, /healthz returns 503 so Kubernetes
  # restarts a process whose discovery loop has wedged (deadlocked) — a wedged
  # loop can no longer update its own last-cycle timestamp, so without this the
  # pod would stay "live" forever and never recover. The same staleness signal
  # also re-asserts network_topology_graph_stale=1 while the loop is stalled.
  # 0 disables the gate (/healthz always 200 once up — prior behaviour). The
  # gate is always inert in pure-hub mode (federation.role: hub), which runs no
  # local discovery loop and so has no cycle timestamp to age out.
  liveness_max_stale_cycles: 3

  # Per-module timeout within a device's total timeout_per_device budget.
  # Prevents one slow protocol walk from consuming the whole device budget.
  # 0 = no additional cap (default); must be < timeout_per_device when set.
  # timeout_per_module: 3s

  # Per-target SNMP request (PDU) rate cap. A high parallelism with every
  # module enabled can otherwise fire hundreds of PDUs/sec at a single slow
  # device and self-DoS its SNMP daemon. This paces the steady-state walk rate
  # against each device independently (per-target isolation). 0 = unlimited
  # (default — unchanged behaviour); set a positive value (e.g. 50) only if a
  # target's agent struggles under load.
  # per_target_pdu_rate_per_second: 50

  # SNMP transport tuning that is not per-module (the on/off module toggles
  # live under modules.snmp).
  snmp:
    # Opt-in per-target SNMP session pool (issue #83). By default every
    # (target × enabled module) walk opens and closes a fresh UDP SNMP session
    # — roughly 9 sessions/target/cycle. On large fleets that churn of sockets
    # (and the matching conntrack entries on stateful firewalls/NAT) can become
    # the dominant cost. When enabled, a target reuses ONE session across its
    # modules within a cycle and across cycles, keyed by (target IP, credential
    # profile). Bounded at one session per (target × profile) (~50KB each), so
    # memory scales with fleet size, not module count.
    #
    # Default OFF: behaviour is byte-identical to a fresh session per walk.
    # Enable on large fleets where socket/conntrack churn matters — see
    # docs/operator/scale.md.
    #
    # Tradeoff: a pooled session holds its own copy of the credential inside
    # the SNMP library until the session is evicted; the per-cycle credential
    # zeroization cannot reach that copy. Idle eviction, shutdown, and
    # credential-rotation invalidation all close the session and clear that
    # copy. Rotate credentials with this in mind (see docs/operator/security.md).
    session_pool:
      enabled: false
      # How long an unused pooled session may sit before it is closed and its
      # credentials cleared. 0 (default) = 5 × discovery.interval.
      # max_idle: 5m

  # Polling-scope guard (hard allow-list). The exporter polls only IPs within
  # these CIDRs. LLDP/CDP-discovered neighbours outside this range surface as
  # network_topology_out_of_scope_neighbours_total but are never polled.
  # Required when targets: is set.
  scope:
    cidr_allow_list:
      - 198.51.100.0/24

  # Per-target protocol scoping (issue #74). By default every module enabled
  # below runs against every in-scope target. On a heterogeneous fleet that
  # wastes cycles and pollutes metrics — e.g. walking BGP against an access
  # switch yields a guaranteed mib_unimplemented walker outcome. An override
  # restricts an IP (matched by longest-prefix CIDR, same precedence as
  # credentials.assignments) to ONLY the listed modules, intersected with the
  # global modules.<m>.enabled gates. An IP matching no override runs ALL
  # enabled modules (unchanged default). Rules:
  #   - every listed module must also be enabled globally (modules.<m>.enabled)
  #   - the modules list must be non-empty (to poll nothing at a CIDR, remove it
  #     from scope.cidr_allow_list instead)
  #   - most-specific CIDR wins; equal-prefix duplicate CIDRs are rejected
  # target_overrides:
  #   - cidr: 198.51.100.0/26      # core routers: full L3 topology
  #     modules: [bgp, isis, lldp]
  #   - cidr: 198.51.100.128/25    # access switches: L2 only, never BGP
  #     modules: [lldp, cdp, fdb]

  # Unidirectional link expiry: remove a link that has not been confirmed from
  # both sides after this many consecutive cycles (default 3; must be >= 1).
  unconfirmed_link_ttl_cycles: 3

  # Graph size admission control: reject a local graph update if it exceeds
  # these limits. 0 = unlimited (default). Counter:
  #   network_topology_graph_updates_rejected_total
  # max_graph_devices: 5000   # default 0 (unlimited); >= 0
  # max_graph_edges: 20000    # default 0 (unlimited); >= 0

# ─── Per-protocol modules ──────────────────────────────────────────────────
modules:
  snmp:
    enabled: true
    version: v2c               # default "v2c"; v2c | v3
    # Legacy single-community path. Production deployments should leave this
    # unset and use credentials.profiles below.
    community_env: SNMP_COMMUNITY
  lldp:
    enabled: true              # default false; IEEE 802.1AB / RFC 4957
  cdp:
    enabled: true              # default false; CISCO-CDP-MIB
  bgp:
    enabled: false             # default false; RFC 4273 BGP4-MIB (IPv4) + vendor BGP4-V2 tables (IPv6)
    # disable_v2_mib: false    # default false since v1.3.0 (v2 walkers enabled).
    #                          # With v2 enabled, the BGP walker picks a vendor
    #                          # table based on sysObjectID and falls back to
    #                          # RFC 4273 if the vendor walk is empty:
    #                          #   - Cisco   cbgpPeer2Table (1.3.6.1.4.1.9.9.187.1.2.5)   — verified
    #                          #   - Arista  enterprise BGP4V2 (1.3.6.1.4.1.30065.4.1.1.2) — verified
    #                          #   - Juniper jnxBgpM2PeerTable (1.3.6.1.4.1.2636.5.1.1.2.1.1) — verified
    #                          #   - Nokia   tBgpPeerTable (1.3.6.1.4.1.6527.3.1.2.13.2) — EXPERIMENTAL
    #                          # "EXPERIMENTAL" = column numbers transcribed from vendor MIB
    #                          # documentation but not yet validated against real hardware. On
    #                          # Nokia SR-OS / SR Linux fleets, set disable_v2_mib: true until
    #                          # #57 closes (Juniper was verified against vJunos, #56). The walker still surfaces
    #                          # failure modes via network_topology_bgp_walker_outcome_total
    #                          # (labels walker_drift / malformed_index / mib_unimplemented),
    #                          # so silent zero-edge dropouts are alertable.
    #                          # Replaces the removed v1.3.0 `use_v2_mib` key (removed in v1.5.0).
  ospf:
    enabled: false             # default false; RFC 4750 OSPF-MIB
  fdb:
    enabled: false             # default false; RFC 4188 BRIDGE-MIB — noisy without filtering
    # max_vlans: 64            # default 100; cap VLAN community-string walks on IOS (1–4096)
  arp:
    enabled: false             # default false; RFC 1213 ipNetToMediaTable; enrichment only (MAC→IP
                               # backfill for FDB stitching), not an edge source.
                               # Only useful when modules.fdb.enabled is also true.
  isis:
    enabled: false             # default false; IS-IS adjacencies via IS-IS MIB (RFC 4444)
  mpls_te:
    enabled: false             # default false; MPLS-TE tunnels via MPLS-TE-MIB (RFC 3812)

# ─── Credential management ─────────────────────────────────────────────────
# Named profiles, per-IP/CIDR assignment, ordered fallback, and a global
# trial rate limit. Secret values are read from environment variables.
# Cold-start lockout runbook: docs/operator/cold-start-credentials.md
credentials:
  profiles:
    - name: edge-v2c
      type: snmp_v2c           # snmp_v2c | snmp_v3
      community_env: SNMP_COMMUNITY
      # retries: 1             # default 1; SNMP retries per request (>= 0)
    - name: core-v3
      type: snmp_v3
      username_env: SNMP_V3_USER
      auth_protocol: SHA-256   # SHA | SHA-256 | SHA-384 | SHA-512 (MD5 rejected)
      auth_key_env: SNMP_V3_AUTH_KEY
      priv_protocol: AES-256   # AES | AES-192 | AES-256 (DES rejected)
      priv_key_env: SNMP_V3_PRIV_KEY
      # retries: 1             # default 1; SNMP retries per request (>= 0)
      # context_name: ""       # default "" (no context); SNMPv3 context name for VRF-aware access
  assignments:
    - cidr: 198.51.100.0/25
      profiles: [core-v3]
    - ip: 198.51.100.10
      profiles: [edge-v2c]
  fallback_order: [edge-v2c]
  # Token bucket shared across all device polls. Caps the cold-start trial
  # rate so a fresh exporter does not trigger SNMP auth-lockout policies.
  trial_rate_per_second: 5     # default 5; must be >= 1

# ─── Startup snapshot ──────────────────────────────────────────────────────
# Versioned JSON snapshot of the reconciled graph plus the credential cache.
# Loaded on startup so /metrics serves stale-but-valid data (with
# network_topology_graph_stale=1) until the first live cycle completes.
snapshot:
  path: /var/lib/network-topology-exporter/snapshot.json  # default path

# ─── Federation ────────────────────────────────────────────────────────────
# Three modes beyond standalone:
#
# uncoordinated: adds network_topology_boundary_observation_info metric for
#   Mimir recording-rule stitching. No inter-instance coordination needed.
#   Recording rule: count by(peer_a,peer_b,proto)(network_topology_boundary_observation_info) == 2
#
# spoke: runs normal discovery + pushes pre-reconciled graph to a hub after
#   each cycle. mTLS is required.
#
# hub: pure aggregator — no local SNMP discovery. Receives spoke pushes,
#   reconciles combined graph, emits unified Prometheus metrics.
#   Exposes /spoke/push on a separate mTLS listener.
#
# federation:
#   role: standalone                  # default "standalone"; standalone | uncoordinated | spoke | hub
#   spoke_timeout: 3m                 # default 3×discovery.interval; evict a silent spoke after this duration
#
#   # Static stitching overrides for boundary ports with inconsistent names.
#   known_inter_domain_links:
#     - local_device: sw-dc-a
#       local_port: Gi0/1
#       remote_device: sw-dc-b
#       remote_port: Gi0/2
#       link_kind: ethernet           # default "ethernet"; free-form link type label
#
#   # Hub-side settings (role: hub). mTLS is required.
#   hub:
#     listen_addr: :9101              # default ":9101"; separate from the metrics listen address
#     tls_ca_cert: /etc/topology-exporter/pki/ca.pem
#     tls_cert:    /etc/topology-exporter/pki/hub.crt
#     tls_key:     /etc/topology-exporter/pki/hub.key
#
#     # Cross-site device name handling. Default false (strict) since v1.3.0:
#     # device names are only lowercased for matching — FQDN suffixes are
#     # preserved so "core-sw.dc1" and "core-sw.dc2" remain distinct. Set to
#     # true ONLY for single-site deployments where mixed short/FQDN forms of
#     # the same device must reconcile (e.g. one spoke reports "core-01" while
#     # another reports "core-01.internal.corp" for the same physical device).
#     # Replaces the removed v1.3.0 `strict_device_name_matching` key (removed in v1.5.0).
#     # loose_device_name_matching: false
#
#     # Graph size admission control for the hub's combined graph.
#     # max_graph_devices: 10000      # default 0 (unlimited); >= 0
#     # max_graph_edges: 50000        # default 0 (unlimited); >= 0
#
#     # Rate-limit per-spoke pushes. Rejects pushes arriving sooner than this
#     # duration after the previous accepted push from the same spoke with HTTP
#     # 429 + Retry-After. 0 = disabled (default). Must be < spoke_timeout.
#     # min_push_interval: 30s        # default 0 (disabled); set to ~½ spoke discovery_interval
#
#   # Spoke-side settings (role: spoke). mTLS is required.
#   spoke:
#     spoke_id: dc-a                  # unique identifier; used in hub metric labels
#     hub_url: https://hub.example.com:9101
#     tls_ca_cert: /etc/topology-exporter/pki/ca.pem
#     tls_cert:    /etc/topology-exporter/pki/spoke-dc-a.crt
#     tls_key:     /etc/topology-exporter/pki/spoke-dc-a.key

# output: optional push-mode output paths (complement to /metrics pull)
# output:
#   otlp:
#     enabled: false                  # default false
#     # For protocol: http use a full URL base (paths /v1/metrics and /v1/logs
#     # are appended by the OpenTelemetry SDK). For protocol: grpc use a bare
#     # host:port authority (e.g. "alloy:4317").
#     endpoint: "http://alloy:4318"
#     timeout: 10s                    # default 10s; OTLP export timeout per push
#     heartbeat_cycles: 10            # default 10; emit a full graph push every N cycles even without changes
#     # protocol selects the OTLP transport: http (default) or grpc.
#     # The payload encoding is always protobuf (the OpenTelemetry Go SDK
#     # exporters do not implement OTLP/JSON) — a wire-format change from the
#     # pre-v1.5.0 hand-rolled JSON path. Receivers must accept protobuf.
#     protocol: http                  # default "http"; http | grpc
#     # traces: opt-in OpenTelemetry tracing of the exporter's own discovery
#     # cycle (v1.7.0, issue #68). Disabled by default. When enabled, spans are
#     # exported over the SAME endpoint + protocol + auth as the metrics/logs
#     # above — tracing has no endpoint of its own. See docs/operator/tracing.md.
#     traces:
#       # enabled turns on tracing. Default false (instrumentation is a no-op).
#       enabled: false
#       # sample_rate is the head-sampling ratio in [0,1] applied to the root
#       # discovery.cycle span; child spans inherit the parent decision
#       # (ParentBased). Default 0.1. Use 1.0 to trace every cycle while
#       # debugging; keep it small in production to bound trace volume.
#       sample_rate: 0.1              # default 0.1; [0, 1]
#   # RFC 8345 YANG-JSON topology output (#75). When enabled, GET /topology/yang
#   # renders the current reconciled topology as RFC 8345/8346 YANG-JSON (same
#   # trust level as /metrics).
#   yang:
#     enabled: false
#     network_id: network-topology-exporter

# ─── Per-device enrichment ─────────────────────────────────────────────────
# Targets attach enrichment metadata (SNMP port, site label, custom labels)
# to devices discovered within the CIDR allow-list. A target IP outside
# the allow-list is rejected at startup.
targets:
  - host: 198.51.100.10
    port: 161              # default 161; SNMP UDP port (1–65535)
    site: lab              # optional; site label attached to this device
    labels:                # optional; free-form key/value labels attached to this device
      environment: dev
