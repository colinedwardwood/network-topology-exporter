name: nte-e2e

# 3-node spine-leaf topology using a custom lightweight test node image
# (Alpine + lldpd + snmpd). The image is ARM64-native so it runs without
# emulation on macOS/OrbStack and CI aarch64 runners, and is ~15 MB compressed.
#
# Build the image before running: make e2e-image
# Run tests:                      CLAB_DOCKER=1 make test-e2e

topology:
  nodes:
    spine1:
      kind: linux
      image: nte-testnode:latest
    leaf1:
      kind: linux
      image: nte-testnode:latest
    leaf2:
      kind: linux
      image: nte-testnode:latest

  links:
    # spine1 eth1 ↔ leaf1 eth1
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    # spine1 eth2 ↔ leaf2 eth1
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
